name: Update Documentation & Notes

on:
  push:
    branches:
      - main
    paths:
      - 'Day-*/**'
      - 'DSA/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: repo-bot
  cancel-in-progress: false

jobs:
  update-docs:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run documentation scripts
        run: |
          node scripts/update-readme.js
          node scripts/update-notes.js

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md INTERVIEW_NOTES.md DSA/README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "docs: auto-update progress, interview & DSA notes [skip ci]"
          git pull --rebase origin main
          git push
